name: Build LuaTools

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LuaToolsGui.sln

      - name: Build
        run: dotnet build LuaToolsGui.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish LuaToolsGui.sln -c Release -r win-x64 --self-contained true --output publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LuaTools-Windows
          path: publish/
